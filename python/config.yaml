# Split copies live under app/*/config.yaml. This file is a fallback for --config.
# EUR/USD backtest defaults. Override via CLI or a copy of this file.
# Targets (PF >= 1.3, max DD <= 20%, Sharpe >= 0.5, trades 500-600) are checklist values, not guarantees.

symbol: EURUSD=X
initial_equity: 100000.0
pip_size: 0.0001

cost:
  spread_pips: 1.0
  slippage_pips: 0.2
  commission_per_lot: 0.0
  lot_size: 100000.0

risk:
  risk_pct: 1.0
  max_trades_per_day: 2
  max_consecutive_losses: 3
  max_daily_loss_r: 2.0

donchian:
  length: 30
  ema_len: 200
  atr_len: 14
  atr_mult: 1.5
  swing_len: 5
  stop_buffer_atr: 0.5
  adx_len: 14
  adx_min: 19.0
  atr_median_len: 50
  use_adx_filter: true
  use_atr_filter: false
  partial_frac: 0.5
  partial_r: 1.0
  exit_on_opposite_break: true
  exit_on_ema_flip: false
  take_profit_r: null

ema_atr:
  fast: 20
  slow: 50
  trend: 200
  atr_len: 14
  atr_mult: 2.5
  take_profit_r: 2.0

engulfing:
  rvol_len: 20
  rvol_min: 1.2
  swing_len: 5
  min_room_r: 1.5
  take_profit_r: 2.0
  adx_len: 14
  adx_range_max: 20.0
  stop_buffer_atr: 0.1

killzone:
  london: "07:00-10:00"
  newyork: "13:00-16:00"
  timezone: UTC
  h1_fast: 21
  h1_slow: 50
  h1_trend: 200
  swing_len: 5
  min_score: 6
  take_profit_r: 2.0
  atr_len: 14
  atr_mult: 1.5
  use_pdh_pdl: true

confluence:
  require_killzone: false
  ranging_adx_max: 20.0
  donchian_width_pct: 0.012

walkforward:
  train_years: 3
  test_years: 1
  step_years: 1

portfolio:
  # Live book. Change `candidates` and `risk_pct_per_pair` (or CLI --pairs / --risk).
  # 5.5% per pair on CAD+JPY(25/1.5/15/ATR-off)+GBP was ~23% yearly mean / ~13% DD on 2015–2026 H4 (checklist, not a guarantee).
  candidates: [USDCAD, USDJPY, GBPUSD]
  risk_pct_per_pair: 5.5
  # Optional per-pair override, e.g. {USDJPY: 3.0}
  risk_pct_by_pair: {}
  # true = trade exactly `candidates`. false = also drop by PF / correlation.
  fixed_book: true
  min_pair_pf: 1.2
  exclude_below_pf: 1.0
  max_corr: 0.7
  portfolio_min_trades: 600
  portfolio_sharpe: 0.6
  portfolio_max_dd: 15.0
  donchian:
    length: 60
    atr_mult: 1.5
    adx_min: 19.0
    use_atr_filter: true

# Outbound signed JSON webhook. Leave url empty to skip. Secret via FX_TRADER_WEBHOOK_SECRET.
webhook:
  url: null
  timeout_sec: 5
  max_attempts: 3

upside:
  core_pairs: [USDCAD, USDJPY, GBPUSD]
  keep_baseline_exit: true
  recommended_risk_pct_per_pair: 5.5
  dd_cap_pct: 15.0
  half_kelly_pct: 8.4
  quarter_kelly_pct: 4.2

targets:
  min_years: 5
  profit_factor: 1.3
  max_drawdown_pct: 20.0
  sharpe: 0.5
  min_trades: 500
  preferred_trades_max: 600
